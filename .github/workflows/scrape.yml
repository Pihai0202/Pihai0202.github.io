name: 每日更新演唱會資料

on:
  schedule:
    # 每天台灣時間 08:00 執行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:   # 也可以手動點按鈕觸發
  push:
    branches: [ main ]
    paths:
      - 'scripts/scrape.py'  # scraper 有改動時也觸發

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要寫入權限才能 commit concerts.json

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🎵 執行爬蟲（KKTIX + 拓元 + ibon + 年代）
        run: |
          mkdir -p public
          python scripts/scrape.py > public/concerts.json
          echo "--- concerts.json preview ---"
          head -30 public/concerts.json

      - name: 📊 確認結果
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('public/concerts.json')); print(d['count'])")
          SOURCES=$(python3 -c "import json; d=json.load(open('public/concerts.json')); print(', '.join(d.get('sources',[])))")
          echo "✅ 共抓到 $COUNT 筆活動（來源：$SOURCES）"

      - name: 💾 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/concerts.json
          # 若沒有變更就不 commit（避免空 commit）
          git diff --staged --quiet || git commit -m "🎵 自動更新演唱會資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
