name: 每日更新演唱會資料

on:
  schedule:
    # 每 30 分鐘更新一次；GitHub Actions 排程可能會有幾分鐘延遲
    - cron: '*/30 * * * *'
  workflow_dispatch:   # 也可以手動點按鈕觸發
  push:
    branches: [ main ]
    paths:
      - 'scripts/scrape.py'  # scraper 有改動時也觸發

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要寫入權限才能 commit concerts.json

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安裝 Python 依賴庫 (curl_cffi)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎵 執行爬蟲（KKTIX + 拓元 + ibon + 寬宏 + 年代）
        run: |
          mkdir -p public
          python scripts/scrape.py
          echo "--- concerts.json preview ---"
          head -30 public/concerts.json

      - name: 🚗 執行大眾運輸狀態爬蟲
        run: |
          python scripts/scrape_transit.py

      - name: ⚠️ 執行停班停課狀態爬蟲
        run: |
          python scripts/scrape_suspension.py

      - name: 📊 確認結果
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('public/concerts.json')); print(d['count'])")
          SOURCES=$(python3 -c "import json; d=json.load(open('public/concerts.json')); print(', '.join(d.get('sources',[])))")
          echo "✅ 共抓到 $COUNT 筆活動（來源：$SOURCES）"
          echo "--- transit-status.json preview ---"
          cat public/transit-status.json
          echo "--- suspension.json preview ---"
          cat public/suspension.json

      - name: 💾 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/concerts.json public/transit-status.json public/suspension.json
          # 若沒有變更就不 commit（避免空 commit）
          git diff --staged --quiet || git commit -m "🎵 自動更新演唱會、交通及停班停課資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
